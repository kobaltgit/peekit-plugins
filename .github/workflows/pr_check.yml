name: PR Plugin Audit & Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'plugins/**'
      - 'template/**'
      - 'pack_plugin.cjs'
      - 'plugin-schema.json'
      - 'registry.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Audit and Test Plugin Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Plugin Packaging and Security Audit
        id: pack
        run: |
          node pack_plugin.cjs --all

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Test Website
        working-directory: website
        run: |
          flutter pub get
          flutter test

      - name: Post PR Summary
        if: always()
        run: |
          echo "### 🧩 PeekIt Plugin Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "All plugins successfully verified for zero-network security, valid manifests, and package builds." >> $GITHUB_STEP_SUMMARY
