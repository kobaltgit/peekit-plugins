name: Deploy Website and Release Packages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'plugins/**'
      - 'registry.json'
      - 'pack_plugin.cjs'
      - '.github/workflows/deploy_website.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Website & Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pack plugins & update registry
        run: |
          node pack_plugin.cjs --all --update-registry

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install website dependencies
        working-directory: website
        run: flutter pub get

      - name: Run website tests
        working-directory: website
        run: flutter test

      - name: Build Flutter Web
        working-directory: website
        run: flutter build web --release --base-href "/peekit-plugins/"

      - name: Ensure packages in build output
        run: |
          mkdir -p website/build/web/plugins
          cp dist/*.pkit website/build/web/plugins/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build/web

      - name: Publish GitHub Release with .pkit assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: PeekIt Official Plugins v1.0.0
          body: |
            Official .pkit packages for PeekIt plugins ecosystem.
            
            Install by double-clicking the downloaded `.pkit` file with PeekIt running.
          files: dist/*.pkit
          draft: false
          prerelease: false

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
