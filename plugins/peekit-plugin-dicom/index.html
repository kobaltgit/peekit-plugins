<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICOM Medical Viewer</title>
  <style>
    :root, [data-theme="dark"] {
      --bg-base: #090d16;
      --bg-surface: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --bg-hover: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --accent-active: #0ea5e9;
      --measure-color: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --hud-text: #38bdf8;
      --header-bg: rgba(15, 23, 42, 0.92);
      --drawer-bg: #0b1120;
      --bottom-bg: rgba(15, 23, 42, 0.94);
      --input-bg: rgba(255, 255, 255, 0.05);
    }

    [data-theme="light"] {
      --bg-base: #0b1120;
      --bg-surface: #ffffff;
      --bg-card: rgba(241, 245, 249, 0.92);
      --bg-card-border: rgba(0, 0, 0, 0.12);
      --bg-hover: rgba(0, 0, 0, 0.06);
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.25);
      --accent-active: #0369a1;
      --measure-color: #d97706;
      --text-main: #0f172a;
      --text-muted: #475569;
      --hud-text: #38bdf8;
      --header-bg: rgba(248, 250, 252, 0.95);
      --drawer-bg: #ffffff;
      --bottom-bg: rgba(248, 250, 252, 0.95);
      --input-bg: rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .header-bar {
      height: 48px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--bg-card-border);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      z-index: 50;
      flex-shrink: 0;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .header-bar::-webkit-scrollbar {
      display: none;
    }

    .header-left, .header-right, .header-center {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .meta-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--bg-card-border);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .meta-chip.modality {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--accent);
    }

    /* Action Buttons */
    .btn-top {
      height: 30px;
      padding: 0 9px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-top:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-top.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-preset {
      height: 28px;
      padding: 0 7px;
      font-size: 11px;
      border-radius: 5px;
    }

    .preset-group {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.03);
      padding: 2px;
      border-radius: 7px;
      border: 1px solid var(--bg-card-border);
    }

    /* Responsive Header Layout for Compact Window */
    @media (max-width: 1080px) {
      #chipPatient, #chipDim {
        display: none;
      }
      .preset-group .btn-lbl {
        display: none;
      }
      .btn-preset {
        padding: 0 6px;
      }
    }

    @media (max-width: 880px) {
      .btn-top .btn-lbl {
        display: none;
      }
      .btn-top {
        padding: 0 8px;
      }
      #lblRotate {
        display: none;
      }
      .logo-badge span {
        display: none;
      }
    }

    @media (max-width: 650px) {
      .btn-top {
        height: 28px;
        padding: 0 6px;
        font-size: 11px;
      }
      .preset-group {
        gap: 2px;
        padding: 1px;
      }
    }

    /* Main Medical Viewport */
    .viewport {
      flex: 1;
      position: relative;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .viewport.panning {
      cursor: grab;
    }
    .viewport.panning:active {
      cursor: grabbing;
    }
    .viewport.measuring {
      cursor: crosshair;
    }
    .viewport.windowing {
      cursor: ns-resize;
    }

    .canvas-container {
      position: relative;
      transform-origin: center center;
      display: inline-block;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }

    canvas#dicomCanvas {
      display: block;
      image-rendering: pixelated;
      max-width: none;
      max-height: none;
    }

    canvas#overlayCanvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* PACS HUD Overlays */
    .hud-corner {
      position: absolute;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      font-family: 'Consolas', 'Courier New', monospace;
      color: var(--hud-text);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.8);
      line-height: 1.35;
    }

    .hud-top-left { top: 12px; left: 16px; }
    .hud-top-right { top: 12px; right: 16px; text-align: right; }
    .hud-bottom-left { bottom: 64px; left: 16px; }
    .hud-bottom-right { bottom: 64px; right: 16px; text-align: right; }

    .hud-line {
      white-space: nowrap;
    }
    .hud-bold {
      font-weight: 700;
      color: #ffffff;
    }

    /* Bottom Floating WL/WW Controls Bar */
    .bottom-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      background: var(--bottom-bg);
      border: 1px solid var(--bg-card-border);
      backdrop-filter: blur(14px);
      border-radius: 10px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      user-select: none;
    }

    .wl-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .wl-input {
      width: 60px;
      background: var(--input-bg);
      border: 1px solid var(--bg-card-border);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 11px;
      font-family: monospace;
      padding: 3px 6px;
      text-align: right;
    }

    .wl-slider {
      width: 90px;
      height: 4px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Metadata Drawer Modal */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: flex-end;
    }

    .drawer-content {
      width: 480px;
      max-width: 90vw;
      height: 100%;
      background: var(--drawer-bg);
      border-left: 1px solid var(--bg-card-border);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
      animation: slideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .drawer-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--bg-card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
    }
    .drawer-close:hover { color: #ffffff; }

    .drawer-search {
      padding: 10px 18px;
      border-bottom: 1px solid var(--bg-card-border);
    }

    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--bg-card-border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      color: #ffffff;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
    }

    .tags-table-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px;
    }

    .tags-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      font-family: 'Consolas', monospace;
    }

    .tags-table th {
      text-align: left;
      padding: 8px 6px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--bg-card-border);
      position: sticky;
      top: 0;
      background: var(--drawer-bg);
      z-index: 2;
    }

    .tags-table td {
      padding: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      vertical-align: top;
      word-break: break-word;
    }

    .tags-table tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .tag-id { color: var(--accent); }
    .tag-name { color: var(--text-muted); }
    .tag-val { color: var(--text-main); }

    /* Toast Pill */
    .toast-pill {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px var(--accent-glow);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 200;
      background: var(--bg-base);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span id="txtLoading">Загрузка и парсинг DICOM...</span>
  </div>

  <!-- Toast Pill -->
  <div class="toast-pill" id="toastPill">Снимок скопирован в буфер обмена</div>

  <!-- Top Bar -->
  <header class="header-bar">
    <div class="header-left">
      <div class="logo-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="9"/>
          <line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="2 2"/>
          <line x1="3" y1="12" x2="21" y2="12" stroke-dasharray="2 2"/>
        </svg>
        <span>DICOM</span>
      </div>
      <div class="meta-chip modality" id="chipModality">CT</div>
      <div class="meta-chip" id="chipDim">512×512</div>
      <div class="meta-chip" id="chipPatient">--</div>
    </div>

    <!-- Center Hounsfield Window Presets -->
    <div class="header-center">
      <div class="preset-group">
        <button class="btn-top btn-preset" id="preBone" title="Костное окно (W:2000, L:300)">🦴 <span class="btn-lbl" id="lblBone">Кости</span></button>
        <button class="btn-top btn-preset" id="preLung" title="Лёгочное окно (W:1500, L:-600)">🫁 <span class="btn-lbl" id="lblLung">Лёгкие</span></button>
        <button class="btn-top btn-preset" id="preBrain" title="Мозг / Мягкие ткани (W:80, L:40)">🧠 <span class="btn-lbl" id="lblBrain">Мозг</span></button>
        <button class="btn-top btn-preset" id="preSoft" title="Брюшная полость / Ткани (W:400, L:50)">🥩 <span class="btn-lbl" id="lblSoft">Ткани</span></button>
        <button class="btn-top btn-preset" id="preReset" title="Сбросить к окну из файла">🔄 <span class="btn-lbl" id="lblReset">Сброс</span></button>
      </div>
    </div>

    <div class="header-right">
      <button class="btn-top" id="btnToggleLang" title="Переключить язык (RU / EN)" style="font-weight:600;font-size:11px;min-width:32px;display:inline-flex;align-items:center;justify-content:center;">RU</button>
      <button class="btn-top" id="btnRuler" title="Инструмент линейки (измерение в мм)">
        📏 <span class="btn-lbl" id="lblRuler">Линейка</span>
      </button>

      <button class="btn-top" id="btnInvert" title="Инвертировать цвета (Негатив / Позитив, I)">
        🌓
      </button>

      <button class="btn-top" id="btnRotate" title="Повернуть на 90° (R)">
        🔄 <span class="btn-lbl" id="lblRotate">0°</span>
      </button>

      <div class="preset-group">
        <button class="btn-top btn-preset" id="btnZoomOut" title="Уменьшить">−</button>
        <button class="btn-top btn-preset" id="btnZoomReset" title="Сбросить масштаб">🔍 <span id="lblZoom">100%</span></button>
        <button class="btn-top btn-preset" id="btnZoomIn" title="Увеличить">+</button>
      </div>

      <button class="btn-top" id="btnSnapshot" title="Скопировать кадр / Сохранить в PNG (Ctrl+C)">
        📷 <span class="btn-lbl" id="lblSnapshot">Снимок</span>
      </button>

      <button class="btn-top" id="btnTags" title="Инспектор всех тегов DICOM">
        📋 <span class="btn-lbl" id="lblTags">Теги</span>
      </button>
    </div>
  </header>

  <!-- Medical Viewport -->
  <main class="viewport" id="viewport">
    <div class="canvas-container" id="canvasContainer">
      <canvas id="dicomCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
    </div>

    <!-- PACS Medical HUD Overlays -->
    <div class="hud-corner hud-top-left">
      <div class="hud-line hud-bold" id="hudPatientName">PATIENT: --</div>
      <div class="hud-line" id="hudPatientId">ID: --</div>
      <div class="hud-line" id="hudStudyDate">DATE: --</div>
    </div>

    <div class="hud-corner hud-top-right">
      <div class="hud-line hud-bold" id="hudInstitution">INSTITUTION: --</div>
      <div class="hud-line" id="hudManufacturer">DEVICE: --</div>
      <div class="hud-line" id="hudSeriesDesc">SERIES: --</div>
      <div class="hud-line" id="hudThickness">THICKNESS: --</div>
    </div>

    <div class="hud-corner hud-bottom-left">
      <div class="hud-line" id="hudWindow">WL: 40  WW: 400</div>
      <div class="hud-line" id="hudWindowTip" style="color: #64748b; font-size: 10px;">(ПКМ + движение: контраст/яркость)</div>
    </div>

    <div class="hud-corner hud-bottom-right">
      <div class="hud-line hud-bold" id="hudCursorDensity">X: --  Y: -- | -- HU</div>
      <div class="hud-line" id="hudZoom">ZOOM: 100%</div>
    </div>
  </main>

  <!-- Bottom Floating Quick Sliders -->
  <div class="bottom-bar" id="bottomBar">
    <div class="wl-group">
      <span>WL:</span>
      <input type="range" class="wl-slider" id="sliderWL" min="-1000" max="3000" value="40">
      <input type="number" class="wl-input" id="inputWL" value="40">
    </div>
    <div class="wl-group">
      <span>WW:</span>
      <input type="range" class="wl-slider" id="sliderWW" min="1" max="4000" value="400">
      <input type="number" class="wl-input" id="inputWW" value="400">
    </div>
  </div>

  <!-- Metadata Inspector Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop">
    <div class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title">
          <span id="drawerTitleText">📋 Метаданные DICOM</span>
          <span class="meta-chip" id="tagsCount">0 тегов</span>
        </div>
        <button class="drawer-close" id="btnCloseDrawer" title="Закрыть">&times;</button>
      </div>
      <div class="drawer-search">
        <input type="text" class="search-input" id="inputTagSearch" placeholder="Поиск тега по номеру или названию...">
      </div>
      <div class="tags-table-wrap">
        <table class="tags-table">
          <thead>
            <tr>
              <th id="thTag" style="width: 80px;">Тег</th>
              <th id="thName" style="width: 140px;">Название</th>
              <th id="thVal">Значение</th>
            </tr>
          </thead>
          <tbody id="tagsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // DOM Elements
      const loadingOverlay = document.getElementById('loadingOverlay');
      const toastPill = document.getElementById('toastPill');
      const dicomCanvas = document.getElementById('dicomCanvas');
      const overlayCanvas = document.getElementById('overlayCanvas');
      const canvasContainer = document.getElementById('canvasContainer');
      const viewport = document.getElementById('viewport');

      const chipModality = document.getElementById('chipModality');
      const chipDim = document.getElementById('chipDim');
      const chipPatient = document.getElementById('chipPatient');

      const hudPatientName = document.getElementById('hudPatientName');
      const hudPatientId = document.getElementById('hudPatientId');
      const hudStudyDate = document.getElementById('hudStudyDate');
      const hudInstitution = document.getElementById('hudInstitution');
      const hudManufacturer = document.getElementById('hudManufacturer');
      const hudSeriesDesc = document.getElementById('hudSeriesDesc');
      const hudThickness = document.getElementById('hudThickness');
      const hudWindow = document.getElementById('hudWindow');
      const hudCursorDensity = document.getElementById('hudCursorDensity');
      const hudZoom = document.getElementById('hudZoom');

      const sliderWL = document.getElementById('sliderWL');
      const inputWL = document.getElementById('inputWL');
      const sliderWW = document.getElementById('sliderWW');
      const inputWW = document.getElementById('inputWW');

      const btnRuler = document.getElementById('btnRuler');
      const btnInvert = document.getElementById('btnInvert');
      const btnRotate = document.getElementById('btnRotate');
      const lblRotate = document.getElementById('lblRotate');
      const btnZoomOut = document.getElementById('btnZoomOut');
      const btnZoomIn = document.getElementById('btnZoomIn');
      const btnZoomReset = document.getElementById('btnZoomReset');
      const lblZoom = document.getElementById('lblZoom');
      const btnSnapshot = document.getElementById('btnSnapshot');
      const btnTags = document.getElementById('btnTags');

      const drawerBackdrop = document.getElementById('drawerBackdrop');
      const btnCloseDrawer = document.getElementById('btnCloseDrawer');
      const inputTagSearch = document.getElementById('inputTagSearch');
      const tagsTableBody = document.getElementById('tagsTableBody');
      const tagsCount = document.getElementById('tagsCount');

      const preBone = document.getElementById('preBone');
      const preLung = document.getElementById('preLung');
      const preBrain = document.getElementById('preBrain');
      const preSoft = document.getElementById('preSoft');
      const preReset = document.getElementById('preReset');

      // State
      let rawBuffer = null;
      let dicomData = null;
      let pixelData = null; // TypedArray (Uint16, Int16, Uint8)
      let ctx = dicomCanvas.getContext('2d');
      let overlayCtx = overlayCanvas.getContext('2d');

      let originalFileDir = '';
      let fileNameBase = 'dicom_image';

      let windowCenter = 40;
      let windowWidth = 400;
      let defaultWL = 40;
      let defaultWW = 400;

      let zoomLevel = 1.0;
      let panX = 0;
      let panY = 0;
      let rotation = 0;
      let isInverted = false;

      let isPanning = false;
      let isWindowing = false;
      let isMeasuring = false;

      let dragStartX = 0;
      let dragStartY = 0;
      let winStartX = 0;
      let winStartY = 0;
      let winStartWL = 40;
      let winStartWW = 400;

      let ruler = null; // { p1: {x, y}, p2: {x, y}, isDraft: boolean }
      let isRulerDragging = false;
      let rulerDragStartPos = null;

      // Known Tag Dictionary (Common DICOM tags)
      const TAG_DICT = {
        '00080008': 'Image Type',
        '00080016': 'SOP Class UID',
        '00080018': 'SOP Instance UID',
        '00080020': 'Study Date',
        '00080030': 'Study Time',
        '00080050': 'Accession Number',
        '00080060': 'Modality',
        '00080070': 'Manufacturer',
        '00080080': 'Institution Name',
        '00081030': 'Study Description',
        '0008103E': 'Series Description',
        '00081090': 'Manufacturer Model',
        '00100010': 'Patient Name',
        '00100020': 'Patient ID',
        '00100030': 'Patient Birth Date',
        '00100040': 'Patient Sex',
        '00180015': 'Body Part Examined',
        '00180050': 'Slice Thickness',
        '00180060': 'KVP',
        '00181150': 'Exposure Time',
        '00181151': 'X-Ray Tube Current',
        '0020000D': 'Study Instance UID',
        '0020000E': 'Series Instance UID',
        '00200010': 'Study ID',
        '00200011': 'Series Number',
        '00200013': 'Instance Number',
        '00200032': 'Image Position (Patient)',
        '00200037': 'Image Orientation',
        '00280002': 'Samples Per Pixel',
        '00280004': 'Photometric Interpretation',
        '00280010': 'Rows',
        '00280011': 'Columns',
        '00280030': 'Pixel Spacing',
        '00280100': 'Bits Allocated',
        '00280101': 'Bits Stored',
        '00280102': 'High Bit',
        '00280103': 'Pixel Representation',
        '00281050': 'Window Center',
        '00281051': 'Window Width',
        '00281052': 'Rescale Intercept',
        '00281053': 'Rescale Slope'
      };

      // Toast helper
      function showToast(msg) {
        toastPill.textContent = msg;
        toastPill.classList.add('show');
        setTimeout(() => toastPill.classList.remove('show'), 2400);
      }

      // Host IPC Communication
      function sendToHost(type, payload = {}) {
        window.parent.postMessage({ type, payload }, '*');
      }

      // Fast DICOM Part 10 Parser in Pure JS
      function parseDicom(buffer) {
        const view = new DataView(buffer);
        const len = buffer.byteLength;
        let offset = 0;

        // Check for 128 byte preamble + 'DICM'
        let hasPreamble = false;
        if (len >= 132) {
          const magic = String.fromCharCode(view.getUint8(128), view.getUint8(129), view.getUint8(130), view.getUint8(131));
          if (magic === 'DICM') {
            hasPreamble = true;
            offset = 132;
          }
        }

        const tags = {};
        const allTagsList = [];
        let littleEndian = true;
        let isExplicit = true;

        while (offset < len - 4) {
          const group = view.getUint16(offset, littleEndian);
          const element = view.getUint16(offset + 2, littleEndian);
          offset += 4;

          const tagHex = group.toString(16).padStart(4, '0').toUpperCase() + 
                         element.toString(16).padStart(4, '0').toUpperCase();

          // Stop if reached pixel data tag (7FE0, 0010)
          if (tagHex === '7FE00010') {
            let pLen = 0;
            if (isExplicit) {
              const vr = String.fromCharCode(view.getUint8(offset), view.getUint8(offset + 1));
              if (['OB', 'OW', 'OF', 'OD', 'SQ', 'UN', 'UT'].includes(vr)) {
                offset += 4; // VR + 2 bytes reserved
                pLen = view.getUint32(offset, littleEndian);
                offset += 4;
              } else {
                pLen = view.getUint16(offset + 2, littleEndian);
                offset += 4;
              }
            } else {
              pLen = view.getUint32(offset, littleEndian);
              offset += 4;
            }

            tags.pixelDataOffset = offset;
            tags.pixelDataLength = pLen === 0xFFFFFFFF ? (len - offset) : pLen;
            break;
          }

          // Check Transfer Syntax if group 0002
          let vr = '';
          let valLen = 0;

          // Attempt to detect Explicit vs Implicit VR
          if (offset < len - 2) {
            const b1 = view.getUint8(offset);
            const b2 = view.getUint8(offset + 1);
            if (b1 >= 65 && b1 <= 90 && b2 >= 65 && b2 <= 90) {
              vr = String.fromCharCode(b1, b2);
              if (['OB', 'OW', 'OF', 'OD', 'SQ', 'UN', 'UT'].includes(vr)) {
                offset += 4;
                if (offset + 4 <= len) {
                  valLen = view.getUint32(offset, littleEndian);
                  offset += 4;
                }
              } else {
                if (offset + 4 <= len) {
                  valLen = view.getUint16(offset + 2, littleEndian);
                  offset += 4;
                }
              }
            } else {
              // Implicit VR
              isExplicit = false;
              if (offset + 4 <= len) {
                valLen = view.getUint32(offset, littleEndian);
                offset += 4;
              }
            }
          }

          if (valLen === 0xFFFFFFFF || valLen < 0 || offset + valLen > len) {
            // Sequence or undefined length
            break;
          }

          // Extract value string/number
          let val = '';
          try {
            if (valLen > 0 && valLen <= 1024) {
              const bytes = new Uint8Array(buffer, offset, valLen);
              val = new TextDecoder('latin1').decode(bytes).replace(/\0+$/, '').trim();
            }
          } catch (e) {}

          // Specific typed tags
          if (tagHex === '00280010') tags.rows = parseInt(val, 10) || view.getUint16(offset, littleEndian);
          else if (tagHex === '00280011') tags.columns = parseInt(val, 10) || view.getUint16(offset, littleEndian);
          else if (tagHex === '00280100') tags.bitsAllocated = parseInt(val, 10) || view.getUint16(offset, littleEndian);
          else if (tagHex === '00280101') tags.bitsStored = parseInt(val, 10) || view.getUint16(offset, littleEndian);
          else if (tagHex === '00280102') tags.highBit = parseInt(val, 10) || view.getUint16(offset, littleEndian);
          else if (tagHex === '00280103') tags.pixelRepresentation = parseInt(val, 10) || view.getUint16(offset, littleEndian);
          else if (tagHex === '00280004') tags.photometricInterpretation = val;
          else if (tagHex === '00281050') tags.windowCenter = parseFloat(val.split('\\')[0]) || 40;
          else if (tagHex === '00281051') tags.windowWidth = parseFloat(val.split('\\')[0]) || 400;
          else if (tagHex === '00281052') tags.rescaleIntercept = parseFloat(val) || 0;
          else if (tagHex === '00281053') tags.rescaleSlope = parseFloat(val) || 1;
          else if (tagHex === '00280030') {
            const parts = val.split('\\');
            tags.pixelSpacing = parts.length >= 2 ? [parseFloat(parts[0]), parseFloat(parts[1])] : null;
          }
          else if (tagHex === '00080060') tags.modality = val;
          else if (tagHex === '00100010') tags.patientName = val;
          else if (tagHex === '00100020') tags.patientId = val;
          else if (tagHex === '00080020') tags.studyDate = val;
          else if (tagHex === '00080080') tags.institutionName = val;
          else if (tagHex === '00080070') tags.manufacturer = val;
          else if (tagHex === '0008103E') tags.seriesDescription = val;
          else if (tagHex === '00180050') tags.sliceThickness = val;

          // Record for inspector
          if (valLen > 0 && valLen <= 256) {
            allTagsList.push({
              tag: `(${tagHex.slice(0, 4)},${tagHex.slice(4)})`,
              tagHex,
              name: TAG_DICT[tagHex] || 'Custom / Private Tag',
              value: val
            });
          }

          offset += valLen;
        }

        tags.allTags = allTagsList;
        return tags;
      }

      // Render DICOM Pixels to HTML5 Canvas (High Performance 60 FPS)
      let cachedImgData = null;
      let cachedData32 = null;
      let fileMinHU = -1000;
      let fileMaxHU = 3000;
      let isCT = true;

      function renderDicom() {
        if (!dicomData || !pixelData) return;

        const cols = dicomData.columns || 512;
        const rows = dicomData.rows || 512;
        if (cols <= 0 || rows <= 0) return;

        if (dicomCanvas.width !== cols || dicomCanvas.height !== rows || !cachedImgData) {
          dicomCanvas.width = cols;
          dicomCanvas.height = rows;
          overlayCanvas.width = cols;
          overlayCanvas.height = rows;
          cachedImgData = ctx.createImageData(cols, rows);
          cachedData32 = new Uint32Array(cachedImgData.data.buffer);
        }

        const data32 = cachedData32;
        const slope = dicomData.rescaleSlope !== undefined ? dicomData.rescaleSlope : 1;
        const intercept = dicomData.rescaleIntercept !== undefined ? dicomData.rescaleIntercept : 0;
        const isMono1 = (dicomData.photometricInterpretation || '').trim() === 'MONOCHROME1';

        const wc = windowCenter;
        const ww = Math.max(1, windowWidth);
        const minVal = wc - (ww / 2);
        const scale = 255.0 / ww;

        const numPixels = cols * rows;
        const count = Math.min(numPixels, pixelData.length);

        for (let i = 0; i < count; i++) {
          const raw = pixelData[i];
          const hu = raw * slope + intercept;

          let val = Math.round((hu - minVal) * scale);
          if (val < 0) val = 0;
          else if (val > 255) val = 255;

          if (isMono1) val = 255 - val;
          if (isInverted) val = 255 - val;

          // RGBA 32-bit packed Little-Endian: AABBGGRR
          data32[i] = (255 << 24) | (val << 16) | (val << 8) | val;
        }

        ctx.putImageData(cachedImgData, 0, 0);
        renderOverlay();
        updateHud();
      }

      // Coordinate helper: maps screen mouse event into exact DICOM pixel coordinates
      function getCanvasPixelCoords(e) {
        const rect = dicomCanvas.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return null;
        const scaleX = dicomCanvas.width / rect.width;
        const scaleY = dicomCanvas.height / rect.height;
        let cx = Math.round((e.clientX - rect.left) * scaleX);
        let cy = Math.round((e.clientY - rect.top) * scaleY);
        cx = Math.max(0, Math.min(dicomCanvas.width - 1, cx));
        cy = Math.max(0, Math.min(dicomCanvas.height - 1, cy));
        return { x: cx, y: cy };
      }

      // Render Measurement Ruler Overlay (PACS Medical Caliper)
      function renderOverlay() {
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        if (!ruler || !ruler.p1) return;

        const p1 = ruler.p1;
        const p2 = ruler.p2 || p1;

        overlayCtx.save();

        // Main caliper line
        overlayCtx.lineWidth = 2;
        overlayCtx.strokeStyle = '#f59e0b';
        overlayCtx.fillStyle = '#f59e0b';

        // Draw start crosshair
        overlayCtx.beginPath();
        overlayCtx.arc(p1.x, p1.y, 4, 0, Math.PI * 2);
        overlayCtx.fill();
        overlayCtx.beginPath();
        overlayCtx.moveTo(p1.x - 6, p1.y);
        overlayCtx.lineTo(p1.x + 6, p1.y);
        overlayCtx.moveTo(p1.x, p1.y - 6);
        overlayCtx.lineTo(p1.x, p1.y + 6);
        overlayCtx.stroke();

        // Draw connecting line
        overlayCtx.beginPath();
        overlayCtx.moveTo(p1.x, p1.y);
        overlayCtx.lineTo(p2.x, p2.y);
        overlayCtx.stroke();

        // Draw end crosshair
        overlayCtx.beginPath();
        overlayCtx.arc(p2.x, p2.y, 4, 0, Math.PI * 2);
        overlayCtx.fill();
        overlayCtx.beginPath();
        overlayCtx.moveTo(p2.x - 6, p2.y);
        overlayCtx.lineTo(p2.x + 6, p2.y);
        overlayCtx.moveTo(p2.x, p2.y - 6);
        overlayCtx.lineTo(p2.x, p2.y + 6);
        overlayCtx.stroke();

        // Calculate Physical Distance in mm
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        let distText = '';

        if (dicomData?.pixelSpacing) {
          const [rowSpacing, colSpacing] = dicomData.pixelSpacing;
          const distMm = Math.sqrt(Math.pow(dx * colSpacing, 2) + Math.pow(dy * rowSpacing, 2));
          const dict = I18N[currentLocale] || I18N.ru;
          distText = `${distMm.toFixed(1)} ${dict.mm}`;
        } else {
          const distPx = Math.sqrt(dx * dx + dy * dy);
          distText = `${distPx.toFixed(0)} px`;
        }

        // Caliper value badge centered on the line
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;

        overlayCtx.font = 'bold 12px Consolas, monospace';
        const textWidth = overlayCtx.measureText(distText).width;
        const padX = 7;
        const padY = 4;
        const boxW = textWidth + padX * 2;
        const boxH = 20;
        const boxX = midX - boxW / 2;
        const boxY = midY - boxH - 6;

        // Badge background
        overlayCtx.fillStyle = 'rgba(15, 23, 42, 0.92)';
        overlayCtx.strokeStyle = '#f59e0b';
        overlayCtx.lineWidth = 1;
        overlayCtx.beginPath();
        if (overlayCtx.roundRect) {
          overlayCtx.roundRect(boxX, boxY, boxW, boxH, 4);
        } else {
          overlayCtx.rect(boxX, boxY, boxW, boxH);
        }
        overlayCtx.fill();
        overlayCtx.stroke();

        // Badge text
        overlayCtx.fillStyle = '#f59e0b';
        overlayCtx.fillText(distText, boxX + padX, boxY + boxH - padY - 2);

        overlayCtx.restore();
      }

      function updateHud() {
        hudWindow.textContent = `WL: ${Math.round(windowCenter)}  WW: ${Math.round(windowWidth)}`;
        hudZoom.textContent = `ZOOM: ${Math.round(zoomLevel * 100)}%`;
        
        // Update sliders only if user is not currently interacting with them
        if (document.activeElement !== sliderWL && document.activeElement !== inputWL) {
          sliderWL.value = Math.round(windowCenter);
          inputWL.value = Math.round(windowCenter);
        }
        if (document.activeElement !== sliderWW && document.activeElement !== inputWW) {
          sliderWW.value = Math.round(windowWidth);
          inputWW.value = Math.round(windowWidth);
        }
      }

      function updateTransform() {
        canvasContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel}) rotate(${rotation}deg)`;
        lblZoom.textContent = `${Math.round(zoomLevel * 100)}%`;
        lblRotate.textContent = `${rotation}°`;
        hudZoom.textContent = `ZOOM: ${Math.round(zoomLevel * 100)}%`;
      }

      function fitToWindow() {
        const vpRect = viewport.getBoundingClientRect();
        const cols = dicomData?.columns || 512;
        const rows = dicomData?.rows || 512;
        if (vpRect.width > 0 && vpRect.height > 0 && cols > 0 && rows > 0) {
          const pad = 36;
          const scaleX = (vpRect.width - pad * 2) / cols;
          const scaleY = (vpRect.height - pad * 2) / rows;
          zoomLevel = Math.min(scaleX, scaleY, 1.5);
          zoomLevel = Math.max(0.1, zoomLevel);
        } else {
          zoomLevel = 1.0;
        }
        panX = 0;
        panY = 0;
        updateTransform();
      }

      // Windowing Presets
      function clearActivePreset() {
        [preBone, preLung, preBrain, preSoft, preReset].forEach(b => b.classList.remove('active'));
      }

      function setWindow(wl, ww, presetName, activeBtn) {
        windowCenter = Math.round(wl);
        windowWidth = Math.max(1, Math.round(ww));
        clearActivePreset();
        if (activeBtn) activeBtn.classList.add('active');
        renderDicom();
        const dict = I18N[currentLocale] || I18N.ru;
showToast(`${dict.windowToast} ${presetName} (WL: ${windowCenter}, WW: ${windowWidth})`);
      }

      preBone.addEventListener('click', (e) => {
        e.stopPropagation();
        const dict = I18N[currentLocale] || I18N.ru;
        if (isCT) {
          setWindow(300, 1500, dict.bone, preBone);
        } else {
          const span = fileMaxHU - fileMinHU;
          setWindow(fileMinHU + span * 0.75, span * 0.5, dict.boneNonCT, preBone);
        }
      });

      preLung.addEventListener('click', (e) => {
        e.stopPropagation();
        const dict = I18N[currentLocale] || I18N.ru;
        if (isCT) {
          setWindow(-600, 1500, dict.lung, preLung);
        } else {
          const span = fileMaxHU - fileMinHU;
          setWindow(fileMinHU + span * 0.25, span * 0.5, dict.lungNonCT, preLung);
        }
      });

      preBrain.addEventListener('click', (e) => {
        e.stopPropagation();
        const dict = I18N[currentLocale] || I18N.ru;
        if (isCT) {
          setWindow(40, 80, dict.brain, preBrain);
        } else {
          const span = fileMaxHU - fileMinHU;
          setWindow(fileMinHU + span * 0.5, span * 0.35, dict.brainNonCT, preBrain);
        }
      });

      preSoft.addEventListener('click', (e) => {
        e.stopPropagation();
        const dict = I18N[currentLocale] || I18N.ru;
        if (isCT) {
          setWindow(50, 350, dict.soft, preSoft);
        } else {
          const span = fileMaxHU - fileMinHU;
          setWindow(fileMinHU + span * 0.5, span * 0.9, dict.softNonCT, preSoft);
        }
      });

      preReset.addEventListener('click', (e) => {
        e.stopPropagation();
        const dict = I18N[currentLocale] || I18N.ru;
        setWindow(defaultWL, defaultWW, dict.reset, preReset);
      });

      // Bottom Bar Events (prevent drag/pan when interacting with sliders)
      const bottomBarEl = document.getElementById('bottomBar');
      if (bottomBarEl) {
        ['mousedown', 'pointerdown', 'touchstart', 'click', 'dblclick'].forEach(evt => {
          bottomBarEl.addEventListener(evt, (e) => e.stopPropagation());
        });
      }

      // Slider Handlers
      sliderWL.addEventListener('input', () => {
        windowCenter = parseFloat(sliderWL.value);
        inputWL.value = Math.round(windowCenter);
        clearActivePreset();
        renderDicom();
      });

      inputWL.addEventListener('input', () => {
        const val = parseFloat(inputWL.value);
        if (!isNaN(val)) {
          windowCenter = val;
          sliderWL.value = val;
          clearActivePreset();
          renderDicom();
        }
      });

      sliderWW.addEventListener('input', () => {
        windowWidth = Math.max(1, parseFloat(sliderWW.value));
        inputWW.value = Math.round(windowWidth);
        clearActivePreset();
        renderDicom();
      });

      inputWW.addEventListener('input', () => {
        const val = parseFloat(inputWW.value);
        if (!isNaN(val) && val > 0) {
          windowWidth = val;
          sliderWW.value = val;
          clearActivePreset();
          renderDicom();
        }
      });

      // Ruler Tool Toggle
      btnRuler.addEventListener('click', (e) => {
        e.stopPropagation();
        isMeasuring = !isMeasuring;
        btnRuler.classList.toggle('active', isMeasuring);
        viewport.classList.toggle('measuring', isMeasuring);
        if (!isMeasuring) {
          ruler = null;
          isRulerDragging = false;
        }
        renderOverlay();
        const dict = I18N[currentLocale] || I18N.ru;
showToast(isMeasuring ? dict.rulerToastOn : dict.rulerToastOff);
      });

      // Invert Colors
      btnInvert.addEventListener('click', (e) => {
        e.stopPropagation();
        isInverted = !isInverted;
        btnInvert.classList.toggle('active', isInverted);
        renderDicom();
        const dict = I18N[currentLocale] || I18N.ru;
showToast(isInverted ? dict.negative : dict.positive);
      });

      // Rotate 90 deg
      btnRotate.addEventListener('click', (e) => {
        e.stopPropagation();
        rotation = (rotation + 90) % 360;
        updateTransform();
      });

      // Zoom Controls
      btnZoomIn.addEventListener('click', (e) => {
        e.stopPropagation();
        zoomLevel = Math.min(8.0, zoomLevel * 1.25);
        updateTransform();
      });

      btnZoomOut.addEventListener('click', (e) => {
        e.stopPropagation();
        zoomLevel = Math.max(0.2, zoomLevel / 1.25);
        updateTransform();
      });

      btnZoomReset.addEventListener('click', (e) => {
        e.stopPropagation();
        fitToWindow();
      });

      // Viewport Mouse & Interaction
      viewport.addEventListener('wheel', (e) => {
        if (e.target.closest('.bottom-bar') || e.target.closest('.drawer-content')) return;
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.15 : 0.85;
        zoomLevel = Math.min(8.0, Math.max(0.2, zoomLevel * delta));
        updateTransform();
      }, { passive: false });

      viewport.addEventListener('mousedown', (e) => {
        // Prevent viewport pan when clicking controls, drawer or bottom bar
        if (e.target.closest('.bottom-bar') || e.target.closest('.header-bar') || e.target.closest('button') || e.target.closest('input')) {
          return;
        }

        // Right Mouse Button -> Interactive Windowing
        if (e.button === 2) {
          e.preventDefault();
          isWindowing = true;
          winStartX = e.clientX;
          winStartY = e.clientY;
          winStartWL = windowCenter;
          winStartWW = windowWidth;
          viewport.classList.add('windowing');
          return;
        }

        // Left Mouse Button -> Ruler or Pan
        if (e.button === 0) {
          if (isMeasuring) {
            const pt = getCanvasPixelCoords(e);
            if (!pt) return;

            // Если уже ждали второй клик (черновик с одной точкой)
            if (ruler && ruler.isDraft && !isRulerDragging) {
              ruler.p2 = pt;
              ruler.isDraft = false;
              renderOverlay();
              return;
            }

            // Начинаем новое измерение
            ruler = { p1: pt, p2: pt, isDraft: true };
            isRulerDragging = true;
            rulerDragStartPos = { clientX: e.clientX, clientY: e.clientY };
            renderOverlay();
            return;
          }

          isPanning = true;
          dragStartX = e.clientX - panX;
          dragStartY = e.clientY - panY;
          viewport.classList.add('panning');
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (isWindowing) {
          const dx = e.clientX - winStartX;
          const dy = e.clientY - winStartY;
          const step = Math.max(1, Math.round(windowWidth / 150));
          windowWidth = Math.max(1, Math.round(winStartWW + dx * step));
          windowCenter = Math.round(winStartWL - dy * step);
          clearActivePreset();
          renderDicom();
          return;
        }

        if (isPanning) {
          panX = e.clientX - dragStartX;
          panY = e.clientY - dragStartY;
          updateTransform();
          return;
        }

        if (isMeasuring && ruler && ruler.isDraft) {
          const pt = getCanvasPixelCoords(e);
          if (pt) {
            ruler.p2 = pt;
            renderOverlay();
          }
        }

        // Density HUD under mouse
        if (pixelData && dicomData) {
          const rect = dicomCanvas.getBoundingClientRect();
          if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
            const scaleX = dicomCanvas.width / rect.width;
            const scaleY = dicomCanvas.height / rect.height;
            const px = Math.floor((e.clientX - rect.left) * scaleX);
            const py = Math.floor((e.clientY - rect.top) * scaleY);

            if (px >= 0 && px < dicomData.columns && py >= 0 && py < dicomData.rows) {
              const idx = py * dicomData.columns + px;
              const raw = pixelData[idx];
              const slope = dicomData.rescaleSlope || 1;
              const intercept = dicomData.rescaleIntercept || 0;
              const hu = Math.round(raw * slope + intercept);

              const dict = I18N[currentLocale] || I18N.ru;
              let tissue = '';
              if (isCT) {
                if (hu < -900) tissue = `(${dict.tissueAir})`;
                else if (hu >= -100 && hu <= -50) tissue = `(${dict.tissueFat})`;
                else if (hu >= -10 && hu <= 15) tissue = `(${dict.tissueFluid})`;
                else if (hu >= 20 && hu <= 60) tissue = `(${dict.tissueSoft})`;
                else if (hu >= 80 && hu <= 200) tissue = `(${dict.tissueBlood})`;
                else if (hu > 250) tissue = `(${dict.tissueBone})`;
              }

              hudCursorDensity.textContent = `X: ${px}  Y: ${py} | ${hu} ${isCT ? 'HU' : 'val'} ${tissue}`;
            }
          }
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (isWindowing) {
          isWindowing = false;
          viewport.classList.remove('windowing');
        }
        if (isPanning) {
          isPanning = false;
          viewport.classList.remove('panning');
        }
        if (isMeasuring && isRulerDragging && ruler && ruler.isDraft) {
          isRulerDragging = false;
          if (rulerDragStartPos) {
            const dist = Math.hypot(e.clientX - rulerDragStartPos.clientX, e.clientY - rulerDragStartPos.clientY);
            if (dist > 6) {
              // Drag-and-drop завершён успешно
              ruler.isDraft = false;
              renderOverlay();
              return;
            }
          }
          // Если просто клик — остаётся черновиком до следующего клика
        }
      });

      viewport.addEventListener('contextmenu', (e) => e.preventDefault());

      // Double click to reset zoom/pan
      viewport.addEventListener('dblclick', (e) => {
        if (e.target.closest('.bottom-bar') || e.target.closest('button') || e.target.closest('input')) return;
        fitToWindow();
      });

      // Window resize handler
      window.addEventListener('resize', () => {
        if (dicomData && zoomLevel <= 1.0) fitToWindow();
      });

      // Tags Drawer Modal
      btnTags.addEventListener('click', (e) => {
        e.stopPropagation();
        drawerBackdrop.style.display = 'flex';
        renderTagsTable();
      });

      btnCloseDrawer.addEventListener('click', () => {
        drawerBackdrop.style.display = 'none';
      });

      drawerBackdrop.addEventListener('click', (e) => {
        if (e.target === drawerBackdrop) drawerBackdrop.style.display = 'none';
      });

      function renderTagsTable(filter = '') {
        if (!dicomData?.allTags) return;
        const q = filter.toLowerCase();
        const list = dicomData.allTags.filter(t => 
          t.tag.toLowerCase().includes(q) || 
          t.name.toLowerCase().includes(q) || 
          t.value.toLowerCase().includes(q)
        );

        const dict = I18N[currentLocale] || I18N.ru;
tagsCount.textContent = `${list.length} ${currentLocale === 'ru' ? 'тегов' : 'tags'}`;
        tagsTableBody.innerHTML = list.map(t => `
          <tr>
            <td class="tag-id">${t.tag}</td>
            <td class="tag-name">${t.name}</td>
            <td class="tag-val">${escapeHtml(t.value)}</td>
          </tr>
        `).join('');
      }

      inputTagSearch.addEventListener('input', () => {
        renderTagsTable(inputTagSearch.value);
      });

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // Snapshot & Save via Host Protocol (PEEKIT_SAVE_FILE)
      async function captureSnapshot() {
        if (!dicomCanvas.width) return;

        dicomCanvas.toBlob(async (blob) => {
          if (!blob) return;
          const snapName = `${fileNameBase}_snapshot.png`;

          // 1. Copy to clipboard
          let clipOk = false;
          try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            clipOk = true;
          } catch (e) {}

          // 2. Convert to Base64 for host PEEKIT_SAVE_FILE
          const buffer = await blob.arrayBuffer();
          const bytes = new Uint8Array(buffer);
          let binary = '';
          for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
          const base64Data = btoa(binary);

          const destPath = originalFileDir 
            ? `${originalFileDir}\\${snapName}` 
            : snapName;

          sendToHost('PEEKIT_SAVE_FILE', {
            path: destPath,
            filePath: destPath,
            dir: originalFileDir,
            fileName: snapName,
            data: base64Data,
            mimeType: 'image/png'
          });

          const dict = I18N[currentLocale] || I18N.ru;
showToast(clipOk ? dict.toastCopied : dict.toastSaved);
        }, 'image/png');
      }

      btnSnapshot.addEventListener('click', captureSnapshot);

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (drawerBackdrop.style.display === 'flex') {

        switch (e.code) {
          case 'KeyC':
            captureSnapshot();
            break;
          case 'KeyR':
            btnRotate.click();
            break;
          case 'KeyI':
            btnInvert.click();
            break;
          case 'KeyM':
            btnRuler.click();
            break;
          case 'Digit1':
            preBone.click();
            break;
          case 'Digit2':
            preLung.click();
            break;
          case 'Digit3':
            preBrain.click();
            break;
          case 'Digit4':
            preSoft.click();
            break;
          case 'Digit0':
            preReset.click();
            break;
          case 'Equal':
          case 'NumpadAdd':
            btnZoomIn.click();
            break;
          case 'Minus':
          case 'NumpadSubtract':
            btnZoomOut.click();
            break;
        }
      });

      
      // --- Theme Engine ---
      function applyTheme(themeData) {
        let isDark = true;
        let accent = null;

        if (typeof themeData === 'string') {
          isDark = themeData.toLowerCase() !== 'light';
        } else if (typeof themeData === 'boolean') {
          isDark = themeData;
        } else if (themeData && typeof themeData === 'object') {
          if (typeof themeData.isDark === 'boolean') isDark = themeData.isDark;
          else if (typeof themeData.theme === 'string') isDark = themeData.theme.toLowerCase() !== 'light';
          else if (typeof themeData.mode === 'string') isDark = themeData.mode.toLowerCase() !== 'light';
          if (themeData.accentColor) accent = themeData.accentColor;
          else if (themeData.accent) accent = themeData.accent;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          isDark = false;
        }

        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.body.classList.toggle('dark-theme', isDark);
        document.body.classList.toggle('light-theme', !isDark);
        if (accent) {
          document.documentElement.style.setProperty('--accent', accent);
        }
      }

      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          applyTheme(e.matches ? 'dark' : 'light');
        });
      }

      let currentLocale = localStorage.getItem('peekit_dicom_lang') || 'ru';

      function applyLocale(locale) {
        if (!locale) return;
        const normalized = String(locale).toLowerCase().startsWith('en') ? 'en' : 'ru';
        currentLocale = normalized;
        try { localStorage.setItem('peekit_dicom_lang', currentLocale); } catch (_) {}
        document.documentElement.setAttribute('lang', currentLocale);

        const dict = I18N[currentLocale] || I18N.ru;
        const btnLang = document.getElementById('btnToggleLang');
        if (btnLang) {
          btnLang.textContent = dict.langBtn;
          btnLang.title = dict.langTitle;
        }

        const txtLoading = document.getElementById('txtLoading');
        if (txtLoading) txtLoading.textContent = dict.loading;

        if (toastPill && !toastPill.classList.contains('show')) {
          toastPill.textContent = dict.toastCopied;
        }

        const lblBone = document.getElementById('lblBone') || document.querySelector('#preBone .btn-lbl');
        if (lblBone) lblBone.textContent = isCT ? dict.bone : dict.boneNonCT;
        const lblSoft = document.getElementById('lblSoft') || document.querySelector('#preSoft .btn-lbl');
        if (lblSoft) lblSoft.textContent = isCT ? dict.soft : dict.softNonCT;
        const lblLung = document.getElementById('lblLung') || document.querySelector('#preLung .btn-lbl');
        if (lblLung) lblLung.textContent = isCT ? dict.lung : dict.lungNonCT;
        const lblBrain = document.getElementById('lblBrain') || document.querySelector('#preBrain .btn-lbl');
        if (lblBrain) lblBrain.textContent = isCT ? dict.brain : dict.brainNonCT;
        const lblReset = document.getElementById('lblReset') || document.querySelector('#preReset .btn-lbl');
        if (lblReset) lblReset.textContent = dict.reset;

        if (preBone) preBone.title = isCT ? dict.boneTitle : dict.boneNonCTTitle;
        if (preLung) preLung.title = isCT ? dict.lungTitle : dict.lungNonCTTitle;
        if (preBrain) preBrain.title = isCT ? dict.brainTitle : dict.brainNonCTTitle;
        if (preSoft) preSoft.title = isCT ? dict.softTitle : dict.softNonCTTitle;
        if (preReset) preReset.title = dict.resetTitle;

        const lblRuler = document.getElementById('lblRuler');
        if (lblRuler) lblRuler.textContent = dict.ruler;
        if (btnRuler) btnRuler.title = dict.rulerTitle;

        const lblSnapshot = document.getElementById('lblSnapshot');
        if (lblSnapshot) lblSnapshot.textContent = dict.snapshot;
        if (btnSnapshot) btnSnapshot.title = dict.snapshotTitle;

        const lblTags = document.getElementById('lblTags');
        if (lblTags) lblTags.textContent = dict.tags;
        if (btnTags) btnTags.title = dict.tagsTitle;

        if (btnInvert) btnInvert.title = dict.invertTitle;
        if (btnRotate) btnRotate.title = dict.rotateTitle;
        if (btnZoomOut) btnZoomOut.title = dict.zoomOutTitle;
        if (btnZoomIn) btnZoomIn.title = dict.zoomInTitle;
        if (btnZoomReset) btnZoomReset.title = dict.zoomResetTitle;

        const hudWindowTip = document.getElementById('hudWindowTip');
        if (hudWindowTip) hudWindowTip.textContent = dict.windowTip;

        const drawerTitleText = document.getElementById('drawerTitleText');
        if (drawerTitleText) drawerTitleText.textContent = dict.metadataTitle;

        if (btnCloseDrawer) btnCloseDrawer.title = dict.closeTitle;

        if (tagsCount && (!dicomData || !dicomData.allTags)) {
          tagsCount.textContent = dict.tagsCountZero;
        }

        const inputTagSearch = document.getElementById('inputTagSearch');
        if (inputTagSearch) inputTagSearch.placeholder = dict.searchPlaceholder;

        const thTag = document.getElementById('thTag');
        if (thTag) thTag.textContent = dict.thTag;
        const thName = document.getElementById('thName');
        if (thName) thName.textContent = dict.thName;
        const thVal = document.getElementById('thVal');
        if (thVal) thVal.textContent = dict.thVal;

        if (dicomData && !dicomData.patientName) {
          chipPatient.textContent = dict.anonymous;
          hudPatientName.textContent = `PATIENT: ${dict.anonymous.toUpperCase()}`;
        }

        if (ruler) renderOverlay();
      }

      // Host IPC Protocol Listeners
      const btnToggleLang = document.getElementById('btnToggleLang');
      if (btnToggleLang) {
        btnToggleLang.addEventListener('click', () => {
          const nextLocale = currentLocale === 'ru' ? 'en' : 'ru';
          applyLocale(nextLocale);
          sendToHost('PEEKIT_LANGUAGE_CHANGED', { locale: nextLocale, language: nextLocale });
        });
      }
      applyLocale(currentLocale);

      let readyInterval = null;

      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;

        switch (msg.type) {
          case 'PEEKIT_INIT':
            if (readyInterval) {
              clearInterval(readyInterval);
              readyInterval = null;
            }
            handleInit(msg.payload);
            break;

          case 'PEEKIT_THEME_CHANGED': {
            const payload = msg.payload || msg;
            applyTheme(payload.theme !== undefined ? payload.theme : payload);
            break;
          }

          case 'PEEKIT_LANGUAGE_CHANGED':
          case 'PEEKIT_LOCALE_CHANGED': {
            const payload = msg.payload || msg;
            const newLang = payload.language || payload.locale || payload.lang || payload;
            if (newLang) {
              applyLocale(newLang);
            }
            break;
          }

          case 'PEEKIT_DATA_RESPONSE':
            if (readyInterval) {
              clearInterval(readyInterval);
              readyInterval = null;
            }
            handleDataResponse(msg.payload);
            break;
        }
      });

      function handleInit(payload) {
        if (!payload) return;
        const langVal = payload.language || payload.locale || payload.lang || (payload.settings && (payload.settings.language || payload.settings.locale));
        if (langVal) {
          applyLocale(langVal);
        }
        const themeVal = payload.theme || (payload.settings && payload.settings.theme) || payload.isDark;
        applyTheme(themeVal !== undefined ? themeVal : payload);
        if (payload.filePath) {
          const sep = Math.max(payload.filePath.lastIndexOf('\\'), payload.filePath.lastIndexOf('/'));
          if (sep !== -1) originalFileDir = payload.filePath.substring(0, sep);
        }
        if (payload.fileName) {
          fileNameBase = payload.fileName.replace(/\.[^/.]+$/, '');
        }

        sendToHost('PEEKIT_REQUEST_DATA');
      }

      function handleDataResponse(payload) {
        const rawData = payload?.data !== undefined ? payload.data : payload;
        const error = payload?.error;

        if (error || !rawData) {
          loadingOverlay.innerHTML = `<span style="color:#ef4444;padding:20px;">Ошибка чтения DICOM: ${error || 'Нет данных'}</span>`;
          return;
        }

        try {
          if (rawData instanceof ArrayBuffer) {
            rawBuffer = rawData;
          } else if (rawData instanceof Uint8Array) {
            rawBuffer = rawData.buffer.slice(rawData.byteOffset, rawData.byteOffset + rawData.byteLength);
          } else if (Array.isArray(rawData)) {
            rawBuffer = new Uint8Array(rawData).buffer;
          }

          processDicomBuffer(rawBuffer);
        } catch (err) {
          console.error('[DicomViewer] Parse error:', err);
          loadingOverlay.innerHTML = `<span style="color:#ef4444;padding:20px;">Ошибка структуры DICOM: ${err.message}</span>`;
        }
      }

      function processDicomBuffer(buffer) {
        dicomData = parseDicom(buffer);
        console.log('[DicomViewer] Parsed DICOM:', dicomData);

        if (!dicomData.pixelDataOffset) {
          throw new Error('Не найден тег пиксельных данных PixelData (7FE0,0010)');
        }

        // Setup pixel array based on bitsAllocated and pixelRepresentation
        const bits = dicomData.bitsAllocated || 16;
        const isSigned = dicomData.pixelRepresentation === 1;
        const pOffset = dicomData.pixelDataOffset;
        const numPixels = (dicomData.columns || 512) * (dicomData.rows || 512);

        if (bits === 16) {
          if (isSigned) {
            pixelData = new Int16Array(buffer, pOffset, numPixels);
          } else {
            pixelData = new Uint16Array(buffer, pOffset, numPixels);
          }
        } else {
          pixelData = new Uint8Array(buffer, pOffset, numPixels);
        }

        // Setup HUD & metadata chips
        const dict = I18N[currentLocale] || I18N.ru;
        chipModality.textContent = dicomData.modality || 'DICOM';
        chipDim.textContent = `${dicomData.columns || 512}×${dicomData.rows || 512}`;
        chipPatient.textContent = dicomData.patientName || dict.anonymous;

        hudPatientName.textContent = `PATIENT: ${dicomData.patientName || dict.anonymous.toUpperCase()}`;
        hudPatientId.textContent = `ID: ${dicomData.patientId || '--'}`;
        hudStudyDate.textContent = `DATE: ${dicomData.studyDate || '--'}`;
        hudInstitution.textContent = `INSTITUTION: ${dicomData.institutionName || 'PACS MEDICAL'}`;
        hudManufacturer.textContent = `DEVICE: ${dicomData.manufacturer || '--'}`;
        hudSeriesDesc.textContent = `SERIES: ${dicomData.seriesDescription || dicomData.modality || '--'}`;
        hudThickness.textContent = dicomData.sliceThickness ? `THICKNESS: ${dicomData.sliceThickness} mm` : 'THICKNESS: --';

        isCT = (dicomData.modality === 'CT') || (dicomData.rescaleSlope !== undefined && dicomData.rescaleSlope !== 0 && dicomData.rescaleIntercept !== undefined);

        // Calculate min/max pixel values to calibrate sliders and presets
        let minRaw = Infinity;
        let maxRaw = -Infinity;
        const sampleStep = Math.max(1, Math.floor(pixelData.length / 50000));
        for (let i = 0; i < pixelData.length; i += sampleStep) {
          const v = pixelData[i];
          if (v < minRaw) minRaw = v;
          if (v > maxRaw) maxRaw = v;
        }
        const slope = dicomData.rescaleSlope !== undefined ? dicomData.rescaleSlope : 1;
        const intercept = dicomData.rescaleIntercept !== undefined ? dicomData.rescaleIntercept : 0;
        fileMinHU = minRaw * slope + intercept;
        fileMaxHU = maxRaw * slope + intercept;

        // Windowing initial setup
        if (dicomData.windowCenter !== undefined && dicomData.windowWidth !== undefined) {
          windowCenter = dicomData.windowCenter;
          windowWidth = dicomData.windowWidth;
        } else {
          windowWidth = Math.max(1, Math.round(fileMaxHU - fileMinHU));
          windowCenter = Math.round(fileMinHU + windowWidth / 2);
        }
        defaultWL = windowCenter;
        defaultWW = windowWidth;

        // Configure sliders dynamic bounds
        const span = Math.max(100, Math.round(fileMaxHU - fileMinHU));
        const margin = Math.round(span * 0.3);
        sliderWL.min = Math.floor(Math.min(fileMinHU - margin, defaultWL - span));
        sliderWL.max = Math.ceil(Math.max(fileMaxHU + margin, defaultWL + span));
        sliderWL.step = span > 2000 ? 5 : 1;

        sliderWW.min = 1;
        sliderWW.max = Math.ceil(Math.max(span * 2, defaultWW * 2));
        sliderWW.step = sliderWL.step;

        sliderWL.value = Math.round(windowCenter);
        inputWL.value = Math.round(windowCenter);
        sliderWW.value = Math.round(windowWidth);
        inputWW.value = Math.round(windowWidth);

        // Pre-activate default reset button
        clearActivePreset();
        preReset.classList.add('active');

        // Refresh UI preset labels and titles through applyLocale
        applyLocale(currentLocale);

        loadingOverlay.style.display = 'none';
        fitToWindow();
        renderDicom();
      }

      // Initial Handshake: Ping until host responds
      readyInterval = setInterval(() => {
        sendToHost('PEEKIT_READY');
      }, 100);
      sendToHost('PEEKIT_READY');

    })();
