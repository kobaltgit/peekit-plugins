<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid lines -->
  <path d="M20 64h88 M64 20v88" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Bezier curve path with glow -->
  <path d="M28 88 C40 32, 88 32, 100 88" fill="none" stroke="url(#curveGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Control lines -->
  <line x1="28" y1="88" x2="40" y2="32" stroke="#475569" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="100" y1="88" x2="88" y2="32" stroke="#475569" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Anchor & Handle points -->
  <!-- Left anchor -->
  <circle cx="28" cy="88" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
  <!-- Right anchor -->
  <circle cx="100" cy="88" r="5" fill="#c084fc" stroke="#0f172a" stroke-width="2" />
  <!-- Left handle -->
  <rect x="36" y="28" width="8" height="8" rx="2" fill="#818cf8" stroke="#0f172a" stroke-width="1.5" />
  <!-- Right handle -->
  <rect x="84" y="28" width="8" height="8" rx="2" fill="#818cf8" stroke="#0f172a" stroke-width="1.5" />

  <!-- Pen tool tip in center-top -->
  <g transform="translate(64, 48) rotate(45)">
    <path d="M0 -18 L7 0 L0 18 L-7 0 Z" fill="url(#penGrad)" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#0f172a" />
    <line x1="0" y1="0" x2="0" y2="18" stroke="#0f172a" stroke-width="1" />
  </g>
</svg>
