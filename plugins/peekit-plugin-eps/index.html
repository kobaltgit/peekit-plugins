            sourceCanvas.width = 1;
            sourceCanvas.height = 1;
            sourceCanvas = null;
          }

          let rendered = false;

          // 1. Fast Path: Embedded TIFF Preview
          if (meta.hasTiff && window.UTIF) {
            try {
              const tiffSlice = bytes.subarray(meta.tiffOffset, meta.tiffOffset + meta.tiffLength);
              const decoded = decodeTiffPreview(tiffSlice);
              if (decoded && decoded.width > 0 && decoded.height > 0) {
                const sc = document.createElement('canvas');
                sc.width = decoded.width;
                sc.height = decoded.height;
                const sctx = sc.getContext('2d');
                const imgData = sctx.createImageData(sc.width, sc.height);
                imgData.data.set(decoded.rgba);
                sctx.putImageData(imgData, 0, 0);

                sourceCanvas = sc;
                imgWidth = sc.width;
                imgHeight = sc.height;
                rendered = true;

                metaEngine.textContent = 'TIFF Превью';
                metaEngine.className = 'engine-badge engine-tiff';
              }
            } catch (tiffErr) {
              console.warn('[EPS] Failed to decode TIFF preview, falling back to PostScript interpreter:', tiffErr);
            }
          }

          // 2. Vector Path: PostScript Interpreter (UDOC.js / FromPS.js)
          if (!rendered) {
            if (typeof window.FromPS === 'undefined' || typeof window.ToContext2D === 'undefined') {
              throw new Error('Векторный интерпретатор PostScript не инициализирован');
            }

            // Extract PostScript buffer slice
            const psBytes = bytes.subarray(meta.psOffset, meta.psOffset + meta.psLength);
            
            // Choose rendering scale based on BoundingBox
            let renderScale = 1.0;
            if (meta.width > 0 && meta.height > 0) {
              const maxDim = Math.max(meta.width, meta.height);
              if (maxDim < 600) renderScale = 2.0;
              else if (maxDim > 3000) renderScale = 0.5;
            }

            const wrt = new window.ToContext2D(0, renderScale);
            window.FromPS.Parse(psBytes.buffer.slice(psBytes.byteOffset, psBytes.byteOffset + psBytes.byteLength), wrt);

            if (!wrt.canvas || wrt.canvas.width === 0 || wrt.canvas.height === 0) {
              throw new Error('В файле отсутствует отображаемая страница PostScript');
            }

            sourceCanvas = wrt.canvas;
            imgWidth = wrt.canvas.width;
            imgHeight = wrt.canvas.height;
            rendered = true;

            metaEngine.textContent = 'Вектор';
            metaEngine.className = 'engine-badge engine-vector';
          }

          // Meta display
          const displayW = meta.width || imgWidth;
          const displayH = meta.height || imgHeight;
          metaRes.textContent = displayW + ' × ' + displayH + ' pt';

          if (meta.creator) {
            let shortCreator = meta.creator.replace(/^(Adobe\s*Illustrator[^\r\n]*)/i, 'Illustrator');
            if (shortCreator.length > 25) shortCreator = shortCreator.slice(0, 24) + '…';
            metaCreator.textContent = shortCreator;
            metaCreator.title = meta.creator;
          } else {
            metaCreator.textContent = 'PostScript';
          }

          loader.classList.add('hidden');
          fitToWindow();
        } catch (err) {
          console.error('[EPS Viewer Error]', err);
          showError(err.message || 'Ошибка парсинга EPS');
        }
      }

      // --- Theme Engine ---
      function applyTheme(themeData) {
        let isDark = true;
        let accent = null;

        if (typeof themeData === 'string') {
          isDark = themeData.toLowerCase() !== 'light';
        } else if (typeof themeData === 'boolean') {
          isDark = themeData;
        } else if (themeData && typeof themeData === 'object') {
          if (typeof themeData.isDark === 'boolean') isDark = themeData.isDark;
          else if (typeof themeData.theme === 'string') isDark = themeData.theme.toLowerCase() !== 'light';
          else if (typeof themeData.mode === 'string') isDark = themeData.mode.toLowerCase() !== 'light';
          if (themeData.accentColor) accent = themeData.accentColor;
          else if (themeData.accent) accent = themeData.accent;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          isDark = false;
        }

        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.body.classList.toggle('light', !isDark);
        checkerPattern = null;
        if (typeof scheduleRender === 'function') scheduleRender();
        if (accent) {
          document.documentElement.style.setProperty('--accent', accent);
        }
      }

      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          applyTheme(e.matches ? 'dark' : 'light');
        });
      }

      // --- Localization Engine ---
      const I18N = {
        ru: {
          langBtn: 'RU',
          langTitle: 'Переключить язык (RU / EN)',
          themeTitle: 'Сменить тему оформления',
          zoomIn: 'Увеличить (Ctrl +)',
          zoomOut: 'Уменьшить (Ctrl -)',
          fit: 'Вписать в окно (Пробел)',
          actual: '100% масштаб',
          engineVector: 'Вектор',
          engineRaster: 'Растр',
          loading: 'Чтение PostScript файла...',
          errTitle: 'Ошибка чтения EPS',
          errMsg: 'Не удалось декодировать структуру PostScript.'
        },
        en: {
          langBtn: 'EN',
          langTitle: 'Toggle Language (RU / EN)',
          themeTitle: 'Toggle Theme',
          zoomIn: 'Zoom In (Ctrl +)',
          zoomOut: 'Zoom Out (Ctrl -)',
          fit: 'Fit to Window (Space)',
          actual: '100% Scale',
          engineVector: 'Vector',
          engineRaster: 'Raster',
          loading: 'Reading PostScript file...',
          errTitle: 'EPS Read Error',
          errMsg: 'Failed to decode PostScript structure.'
        }
      };

      let currentLocale = localStorage.getItem('peekit_eps_lang') || 'ru';

      function applyLocale(locale) {
        if (!locale) return;
        const normalized = String(locale).toLowerCase().startsWith('en') ? 'en' : 'ru';
        currentLocale = normalized;
        try { localStorage.setItem('peekit_eps_lang', currentLocale); } catch (_) {}

        const dict = I18N[currentLocale] || I18N.ru;
        const btnLang = document.getElementById('btnToggleLang');
        if (btnLang) {
          btnLang.textContent = dict.langBtn;
          btnLang.title = dict.langTitle;
        }
        const btnTheme = document.getElementById('btnThemeToggle');
        if (btnTheme) {
          btnTheme.title = dict.themeTitle;
        }

        const btnZoomIn = document.getElementById('btn-zoom-in');
        if (btnZoomIn) btnZoomIn.title = dict.zoomIn;
        const btnZoomOut = document.getElementById('btn-zoom-out');
        if (btnZoomOut) btnZoomOut.title = dict.zoomOut;
        const btnFit = document.getElementById('btn-fit');
        if (btnFit) btnFit.title = dict.fit;
        const btnActual = document.getElementById('btn-actual');
        if (btnActual) btnActual.title = dict.actual;

        const metaEngine = document.getElementById('meta-engine');
        if (metaEngine) {
          const isRaster = metaEngine.classList.contains('engine-raster');
          metaEngine.textContent = isRaster ? dict.engineRaster : dict.engineVector;
        }

        const loaderText = document.querySelector('.loader-text');
        if (loaderText) loaderText.textContent = dict.loading;
        const errorTitle = document.querySelector('.error-title');
        if (errorTitle) errorTitle.textContent = dict.errTitle;
        const errorMsg = document.getElementById('error-msg');
        if (errorMsg) errorMsg.textContent = dict.errMsg;
      }

      // Initialize UI controls
      const btnToggleLang = document.getElementById('btnToggleLang');
      if (btnToggleLang) {
        btnToggleLang.addEventListener('click', (e) => {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          const nextLocale = currentLocale === 'ru' ? 'en' : 'ru';
          applyLocale(nextLocale);
          window.parent.postMessage({ type: 'PEEKIT_LANGUAGE_CHANGED', payload: { language: nextLocale } }, '*');
        });
      }
      const btnThemeToggle = document.getElementById('btnThemeToggle');
      if (btnThemeToggle) {
        btnThemeToggle.addEventListener('click', (e) => {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          const isCurrentDark = document.documentElement.getAttribute('data-theme') !== 'light';
          applyTheme(isCurrentDark ? 'light' : 'dark');
        });
      }
      applyLocale(currentLocale);

      // Send PEEKIT_READY (max 3 attempts, 300ms apart)
      let readyAttempts = 0;
      const readyInterval = setInterval(() => {
        if (initReceived || readyAttempts >= 3) {
          clearInterval(readyInterval);
          return;
        }
        readyAttempts++;
        window.parent.postMessage({ type: 'PEEKIT_READY' }, '*');
      }, 300);
      window.parent.postMessage({ type: 'PEEKIT_READY' }, '*');

      // PeekIt IPC Handshake
      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;

        switch (msg.type) {
          case 'PEEKIT_INIT': {
            initReceived = true;
            clearInterval(readyInterval);

            const payload = msg.payload || msg;
            const langVal = payload.language || payload.locale || payload.lang || (payload.settings && (payload.settings.language || payload.settings.locale));
            if (langVal) {
              applyLocale(langVal);
            }

            const themeVal = payload.theme || (payload.settings && payload.settings.theme) || payload.isDark;
            applyTheme(themeVal !== undefined ? themeVal : payload);

            // Deduplicate data requests
            const currentPath = payload.filePath || payload.fileName;
            if (currentPath && currentPath === lastLoadedPath && (isRequestPending || sourceCanvas)) {
              return;
            }
            lastLoadedPath = currentPath;
            isRequestPending = true;

            // Reset UI
            loader.classList.remove('hidden');
            errorBox.classList.remove('show');

            window.parent.postMessage({ type: 'PEEKIT_REQUEST_DATA' }, '*');
            break;
          }

          case 'PEEKIT_THEME_CHANGED': {
            const payload = msg.payload || msg;
            applyTheme(payload.theme !== undefined ? payload.theme : payload);
            break;
          }

          case 'PEEKIT_LANGUAGE_CHANGED':
          case 'PEEKIT_LOCALE_CHANGED': {
            const payload = msg.payload || msg;
            const newLang = payload.language || payload.locale || payload.lang || payload;
            if (newLang) {
              applyLocale(newLang);
            }
            break;
          }

          case 'PEEKIT_DATA_RESPONSE': {
            isRequestPending = false;
            const rawData = msg.payload?.data !== undefined ? msg.payload.data : (msg.payload !== undefined ? msg.payload : msg.data);
            const error = msg.payload?.error || msg.error;

            if (error) {
              showError('Ошибка чтения файла: ' + error);
              return;
            }

            if (!rawData) {
              showError('Пустые данные файла');
              return;
            }

            let buffer = null;
            if (rawData instanceof ArrayBuffer) {
              buffer = rawData;
            } else if (ArrayBuffer.isView(rawData)) {
              buffer = rawData.buffer.slice(rawData.byteOffset, rawData.byteOffset + rawData.byteLength);
            } else if (Array.isArray(rawData)) {
              const u8 = new Uint8Array(rawData);
              rawData.length = 0; // Release huge number array from memory immediately
              buffer = u8.buffer;
            } else if (typeof rawData === 'string') {
              const bin = atob(rawData);
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
              buffer = bytes.buffer;
            }

            if (!buffer) {
              showError('Неподдерживаемый формат данных буфера');
              return;
            }

            renderEps(buffer);
            break;
          }
        }
      });

      // Window resize
      window.addEventListener('resize', () => {
        if (imgWidth && imgHeight) {
          fitToWindow();
        }
      });
    })();
  </script>
</body>
</html>
